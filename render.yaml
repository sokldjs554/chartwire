# Render 블루프린트 (spec §12.2) — 무료 티어 데모 배포.
# 모든 데이터는 합성(SYNTHETIC)입니다 — 실제 환자 정보 없음.
#
# 한 웹 서비스가 `chartwire serve all --embedded` 로 api + worker + stt-worker 태스크를 한 프로세스에서 돌린다
# (PostgreSQL 풀 5, STT 시뮬레이터 전용). Render 관리형 Postgres 는 역할을 하나만 주므로 아래에서
# CHARTWIRE_DATABASE_URL 과 CHARTWIRE_DATABASE_OWNER_URL 을 같은 connectionString 에 묶는다 —
# 마이그레이션과 런타임이 같은 역할(= 테이블 소유자)로 접속한다. 단일 역할 적응은 환경변수가 아니라
# 카탈로그 조회로 동작한다: `migrations/helpers.app_role_exists()` 가 `chartwire_app` 이 없는 것을 보고
# GRANT 를 건너뛰고, 0006 이 `segment_search` 에도 FORCE ROW LEVEL SECURITY 를 건다. FORCE 덕분에
# 소유자로 접속해도 테넌트 격리는 유지되지만, `search_segments()` 의 owner 면제가 사라져 검색이 느린
# RLS 경로(§4.6 Q2b)로 떨어진다 — docs/limitations.md 에 적어 두었다.
# 무료 티어 한계(콜드 스타트, 무료 DB 만료)는 docs/limitations.md 에 적혀 있고 README 는 동작할 때만 URL 을 보여준다.
services:
  - type: web
    name: chartwire
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: chartwire serve all --embedded
    # 마이그레이션과 데모 시드는 배포 전에 한 번 돈다. `preDeployCommand` 가 이 플랜/인스턴스 타입에서
    # 거부되면 위 dockerCommand 와 아래 preDeployCommand 를 지우고 다음 한 줄로 대체하면 된다.
    # 두 명령 모두 멱등이라 매 기동마다 실행돼도 안전하다(`db upgrade` 는 head 면 no-op,
    # `seed --demo --if-empty` 는 데모 테넌트가 있으면 건너뛴다):
    #   dockerCommand: sh -c "chartwire db upgrade && chartwire seed --demo --if-empty && chartwire serve all --embedded"
    preDeployCommand: chartwire db upgrade && chartwire seed --demo --if-empty
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CHARTWIRE_ROLE
        value: all
      - key: CHARTWIRE_EMBEDDED
        value: "1"
      - key: CHARTWIRE_DATABASE_URL
        fromDatabase:
          name: chartwire-db
          property: connectionString
      - key: CHARTWIRE_DATABASE_OWNER_URL
        fromDatabase:
          name: chartwire-db
          property: connectionString
      - key: CHARTWIRE_REDIS_URL
        fromService:
          type: keyvalue
          name: chartwire-kv
          property: connectionString
      - key: CHARTWIRE_KEK_MASTER
        generateValue: true          # Render 가 base64 256-bit 값을 생성 → kek_master 검증(정확히 32 B) 통과; LocalKek 전용, KMS 는 AWS 배포
      - key: CHARTWIRE_JWT_SECRET
        generateValue: true
      - key: CHARTWIRE_OBJECTSTORE
        value: localfs:/var/lib/chartwire/objects   # 무료 티어: 디스크 비영속 — 재배포 시 오디오 암호문 소실(파기 데모에는 충분)
      - key: CHARTWIRE_NOTE_PROVIDER
        value: extractive            # LLM 키 없이 동작; anthropic 티어는 실행하지 않음
      - key: CHARTWIRE_ALLOW_SIM_FRAMES
        value: "true"
      - key: CHARTWIRE_NODE_ID
        value: render-1
      - key: PORT
        value: "8000"

databases:
  - name: chartwire-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []                  # 내부 네트워크에서만 접속

# Render Key Value (Redis 호환) — 재구축 가능한 캐시이므로 무료 플랜의 비영속 스토리지로 충분하다 (ADR-0002).
keyvalues:
  - name: chartwire-kv
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction      # 스트림/세션 해시가 조용히 사라지지 않게 한다; 넘치면 XADD 가 실패해 fail-closed
    ipAllowList: []
