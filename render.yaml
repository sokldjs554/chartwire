# Render 블루프린트 (spec §12.2) — 공개 데모 배포. 모든 데이터는 합성(SYNTHETIC)입니다.
#
# 관리형 리소스를 하나도 쓰지 않는다. Render 무료 플랜은 계정당 관리형 Postgres 1개와 Key Value 1개만
# 주는데 그 두 슬롯이 다른 프로젝트에 이미 쓰이고 있어, 데모는 무료 웹 서비스 한 개 안에서
# PostgreSQL 16 · Redis 7 · api + worker + stt-worker 를 모두 띄운다
# (`deploy/render-demo/Dockerfile`, 기동 순서는 `deploy/render-demo/start.sh`).
#
# 이 구성의 뜻밖의 이점: 컨테이너 안에서는 superuser 를 쓸 수 있어 `chartwire_owner` 와
# NOBYPASSRLS 인 `chartwire_app` 두 역할을 제대로 만든다. 관리형 Postgres 는 역할을 하나만 주므로
# 소유자로 접속하는 저하 경로(§4.6 Q2b)로 떨어졌을 것이다 — 데모가 오히려 운영 형태에 더 가깝다.
#
# 대가는 docs/limitations.md §7 에 적어 두었다: 한 컨테이너 안의 데이터베이스라 재배포마다 데이터가
# 사라지고(기동 시 마이그레이션 + 데모 시드가 다시 돈다), 무료 인스턴스는 15분 무접속이면 잠들며
# 다시 깨어나 initdb 까지 마치는 데 1~2분이 걸린다. 운영에 가까운 형태는 `docker-compose.yml`(컨테이너 5개)과
# `infra/cdk/`(RDS · ElastiCache · ECS Fargate ×3, synth 만) 에 있다.
services:
  - type: web
    name: chartwire
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render-demo/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # 둘 다 없거나 형식이 맞지 않으면 start.sh 가 직접 만든다. KEK 는 데이터베이스와 수명을 같이해야
      # 하므로(키가 바뀌면 기존 세션 DEK 를 풀 수 없다) 생성한 값을 데이터 디렉터리 옆에 보관한다.
      # LocalKek 전용이다 — KMS 는 AWS 배포(`infra/cdk/`)에서만 쓴다.
      - key: CHARTWIRE_KEK_MASTER
        generateValue: true
      - key: CHARTWIRE_JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8000"
