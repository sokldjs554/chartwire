# CI (spec §12.3). lint → unit → integration → migrations (WP-A) → eval-smoke → load-smoke → cdk → docker →
# frozen-artifacts (WP-H). integration 은 통합자가 정한 직렬 그룹 그대로(docs/dev/AGENT_ENV.md "Test run").
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - name: mypy --strict (pyproject overrides list the strict modules)
        run: mypy src/chartwire/ws/core.py src/chartwire/ws/codec.py src/chartwire/notes/verifier.py src/chartwire/crypto src/chartwire/outbox
      # setuptools/pip/wheel 은 이 프로젝트의 의존성이 아니라 러너가 미리 넣어 둔 빌드 도구다. 낡은 채로
      # 두면 그쪽에 새 권고가 뜰 때마다 프로젝트와 무관하게 감사가 빨개진다(PYSEC-2026-3447 이 그랬다).
      # 감사 전에 올려 두고, 선언된 의존성에 대한 게이트는 그대로 유지한다.
      - name: 빌드 도구 최신화 (감사 대상은 선언된 의존성이어야 한다)
        run: pip install --upgrade pip setuptools wheel
      - name: pip-audit
        run: pip-audit --progress-spinner off

  unit:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q -p no:cacheprovider --junitxml=junit-unit-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit-${{ matrix.python-version }}
          path: junit-unit-*.xml

  integration:
    needs: lint
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CHARTWIRE_SUPERUSER_URL: postgresql://postgres@localhost:5432/postgres
      CHARTWIRE_DATABASE_URL: postgresql+asyncpg://chartwire_app:chartwire_app@localhost:5432/chartwire
      CHARTWIRE_DATABASE_OWNER_URL: postgresql+psycopg://chartwire_owner:chartwire_owner@localhost:5432/chartwire
      CHARTWIRE_REDIS_URL: redis://localhost:6379/0
      CHARTWIRE_TEST_DB: chartwire_test
      CHARTWIRE_TEST_REDIS_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: bootstrap roles + databases (idempotent, superuser)
        run: chartwire db bootstrap-roles
      # Serial, one suite group at a time, each on its own database / Redis index — exactly how the
      # integrator ran them (docs/dev/AGENT_ENV.md "Test run"). Groups mirror the work packages; the
      # migrated_db fixture creates/migrates the database named by CHARTWIRE_TEST_DB.
      - name: rls + migrations (A)
        run: CHARTWIRE_TEST_DB=chartwire_test_a CHARTWIRE_TEST_REDIS_DB=1 pytest tests/rls tests/integration/test_migrations.py -q -p no:cacheprovider -p no:xdist --junitxml=junit-a.xml
      - name: ws protocol cores (B, no services)
        run: CHARTWIRE_TEST_DB=chartwire_test_b CHARTWIRE_TEST_REDIS_DB=2 pytest tests/ws -q -p no:cacheprovider -p no:xdist --junitxml=junit-b0.xml
      - name: ws ingest/watch/drain e2e (B, uvicorn 8101)
        run: CHARTWIRE_TEST_DB=chartwire_test_b CHARTWIRE_TEST_REDIS_DB=2 pytest tests/integration/test_ws_state.py tests/integration/test_ws_ingest.py tests/integration/test_ws_watch.py tests/integration/test_ws_drain.py -q -p no:cacheprovider -p no:xdist --junitxml=junit-b1.xml
      - name: stt-worker + alerts (C, incl. SIGSTOP chaos)
        run: CHARTWIRE_TEST_DB=chartwire_test_c CHARTWIRE_TEST_REDIS_DB=3 pytest tests/integration/test_alerts.py tests/integration/test_stt_worker.py tests/integration/test_stt_worker_chaos.py -q -p no:cacheprovider -p no:xdist --junitxml=junit-c.xml
      - name: notes service + REST (D)
        run: CHARTWIRE_TEST_DB=chartwire_test_d CHARTWIRE_TEST_REDIS_DB=4 pytest tests/integration/test_notes_service.py tests/integration/test_notes_rest.py -q -p no:cacheprovider -p no:xdist --junitxml=junit-d.xml
      - name: REST / RBAC / middleware / PHI logs / purge (E)
        run: CHARTWIRE_TEST_DB=chartwire_test_e CHARTWIRE_TEST_REDIS_DB=5 pytest tests/integration/test_rbac_matrix.py tests/integration/test_api_auth_users.py tests/integration/test_api_middleware.py tests/integration/test_api_patients_consents.py tests/integration/test_api_sessions.py tests/integration/test_phi_logs.py tests/integration/test_purge_pipeline.py -q -p no:cacheprovider -p no:xdist --junitxml=junit-e.xml
      - name: seed + bulk/perf study (F)
        run: CHARTWIRE_TEST_DB=chartwire_test_f CHARTWIRE_TEST_REDIS_DB=6 pytest tests/integration/test_seed.py tests/integration/test_bulk_small.py -q -p no:cacheprovider -p no:xdist --junitxml=junit-f.xml
      - name: outbox poller / tickers / cli / ops routes + worker SIGKILL chaos (G)
        run: CHARTWIRE_TEST_DB=chartwire_test_g CHARTWIRE_TEST_REDIS_DB=7 pytest tests/integration/test_outbox_poller.py tests/integration/test_outbox_tickers.py tests/integration/test_outbox_cli.py tests/integration/test_ops_routes.py tests/chaos -q -p no:cacheprovider -p no:xdist --junitxml=junit-g.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: junit-*.xml

  migrations:
    needs: lint
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CHARTWIRE_SUPERUSER_URL: postgresql://postgres@localhost:5432/postgres
      CHARTWIRE_DATABASE_OWNER_URL: postgresql+psycopg://chartwire_owner:chartwire_owner@localhost:5432/chartwire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: pg_dump 16 client (server is postgres:16; the dump must come from a matching client)
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
      - run: pip install -e ".[dev]"
      - run: chartwire db bootstrap-roles
      - name: upgrade head → downgrade base → upgrade head
        run: |
          chartwire db upgrade head
          chartwire db downgrade base
          chartwire db upgrade head
      - name: schema diff against committed docs/db/schema.sql
        run: chartwire db schema-dump --check

  # ---------------------------------------------------------------------------------
  # WP-H (spec §11.1 eval-smoke, §11.2 load-smoke, §12.1 cdk, §12.2 docker, §11.3 frozen-artifacts)
  # ---------------------------------------------------------------------------------

  eval-smoke:
    # seed 7, 20 scripts (§11.1): held-out recall ≥ 0.55 and precision ≥ 0.70, injection leaks 0,
    # paraphrase false-rejection ≤ 5 %, purge residual 0 and rls leaks 0 (both skipped when
    # var/eval/{purge,rls}.json are absent — those run with `chartwire eval purge|rls --run`, which needs
    # PostgreSQL + Redis, in the measurement window). The held-out numbers are the **measured** floor of
    # the shipped detector (0.573 / 0.763 on the frozen 300-sentence set), not the §11.1 target of 0.6:
    # the held-out set is never tuned against, so the gate tracks what was measured. The thresholds live
    # in `chartwire.eval.cli.SMOKE_THRESHOLDS`; a miss fails the job on purpose.
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: frozen held-out set (the eval refuses a changed file)
        run: cd src/chartwire/eval/data && sha256sum -c FROZEN.txt
      - name: chartwire eval all --seed 7 --n 20 --check
        run: chartwire eval all --seed 7 --n 20 --per-class 20 --check --out "$RUNNER_TEMP/eval"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-smoke
          path: ${{ runner.temp }}/eval/*.json

  load-smoke:
    # scenario A, N=20, 30 s (§11.2): api / worker / stt-worker as separate processes, thresholds generous
    # (ack p95 < 1 s, loss 0). Not pinned (--no-pin): hosted runners do not guarantee 4 cores. The JSON is an
    # artifact, never a README number (README numbers come from the serial measurement window, §0).
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CHARTWIRE_SUPERUSER_URL: postgresql://postgres@localhost:5432/postgres
      CHARTWIRE_DATABASE_URL: postgresql+asyncpg://chartwire_app:chartwire_app@localhost:5432/chartwire_load
      CHARTWIRE_DATABASE_OWNER_URL: postgresql+psycopg://chartwire_owner:chartwire_owner@localhost:5432/chartwire_load
      CHARTWIRE_REDIS_URL: redis://localhost:6379/8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: chartwire loadtest A --sessions 20 --duration 30 (creates + migrates chartwire_load itself)
        run: >-
          chartwire loadtest A --sessions 20 --duration 30 --no-pin --tail-wait 15
          --out "$RUNNER_TEMP/loadtest" --eval-dir "$RUNNER_TEMP/loadtest" --workdir "$RUNNER_TEMP/loadtest/work"
      - name: thresholds — ack p95 < 1000 ms, loss 0, every session ended
        run: |
          python - <<'PY'
          import json, os, sys
          run = next(r for r in json.load(open(os.environ["RUNNER_TEMP"] + "/loadtest/A.json"))["runs"] if r["n"] == 20)
          bad = []
          if run["ack_p95_ms"] is None or run["ack_p95_ms"] >= 1000: bad.append(f"ack p95 {run['ack_p95_ms']} ms")
          if run["loss"] != 0: bad.append(f"loss {run['loss']}")
          if run["db"]["sessions_ended"] != run["n"]: bad.append(f"ended {run['db']['sessions_ended']}/{run['n']}")
          print({k: run[k] for k in ("n", "ack_p50_ms", "ack_p95_ms", "final_e2e_p95_ms", "chunks_per_s", "loss", "dup")})
          sys.exit(f"load-smoke thresholds missed: {bad}" if bad else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-smoke
          path: |
            ${{ runner.temp }}/loadtest/*.json
            ${{ runner.temp }}/loadtest/results.md
            ${{ runner.temp }}/loadtest/work/logs/*.log

  cdk:
    # §12.1: synth + cdk-nag (AwsSolutionsChecks errors fail app.py), template assertions, committed template
    # unchanged. The Python app runs the same synth `npx aws-cdk@2 synth` would (cdk.json → `python app.py`);
    # the CLI is exercised too so the committed template is what a `cdk deploy` would use.
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev,infra]"
      - name: synth + cdk-nag (python)
        run: cd infra/cdk && python app.py
      - name: template assertions
        run: pytest infra/cdk/tests -q -p no:cacheprovider
      - name: synth via the CDK CLI (pinned major)
        run: cd infra/cdk && npx --yes aws-cdk@2 synth --quiet
      - name: committed template unchanged
        run: git diff --exit-code -- infra/cdk/cdk.out/ChartwireStack.template.json

  docker:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t chartwire:local .
      - name: image starts and answers --version as the non-root user
        run: docker run --rm chartwire:local chartwire --version
      - name: compose config (default + drain profile)
        run: |
          docker compose config -q
          docker compose --profile drain config -q
      # `config -q` cannot see a runtime failure: the named `scripts` volume used to be created
      # root:root while the container runs as uid 10001, so `migrate` died writing the demo scripts and
      # every service that waits on it never started. Bring the stack up for real and hit the console.
      - name: compose up (the README's zero-prerequisite path)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: api serves the console and reports ready
        run: |
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS http://127.0.0.1:8000/console | grep -q SYNTHETIC
          docker compose ps            # --wait already required every healthcheck to pass
      - name: compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: compose down
        if: always()
        run: docker compose down -v

  render-demo:
    # 공개 데모 이미지(deploy/render-demo/): PostgreSQL 16 · Redis 7 · api+worker+stt-worker 가 한
    # 컨테이너 안에서 스스로 올라오는지 실제로 띄워 확인한다. 빌드만으로는 무료 인스턴스의 비영속
    # 디스크에서 매 기동마다 다시 도는 경로(initdb → 역할 → 마이그레이션 → 데모 시드)를 볼 수 없다.
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker build (데모 이미지)
        run: docker build -f deploy/render-demo/Dockerfile -t chartwire-demo:local .
      - name: 빈 디스크에서 기동 (initdb → 역할 → 마이그레이션 → 데모 시드 → serve)
        run: |
          docker run -d --name cwdemo -p 8000:8000 chartwire-demo:local
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/healthz > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz
      - name: 루트가 콘솔로 보내고 콘솔이 뜬다
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 302
          curl -fsS http://127.0.0.1:8000/console | grep -q SYNTHETIC
          curl -fsS http://127.0.0.1:8000/readyz
      - name: 데모 계정으로 로그인하고 세션이 조회된다 (익명은 401)
        run: |
          tok=$(curl -fsS -X POST http://127.0.0.1:8000/v1/auth/token \
                  -H 'content-type: application/json' \
                  -d '{"tenant_slug":"demo","email":"clinician@demo.clinic","password":"demo1234!"}' \
                | python3 -c 'import sys, json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "authorization: Bearer $tok" 'http://127.0.0.1:8000/v1/sessions?state=created' > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/sessions)" = 401
      # 관리형 Postgres 였다면 역할이 하나뿐이라 소유자로 접속하는 저하 경로(§4.6 Q2b)로 떨어진다.
      # 컨테이너 안 PostgreSQL 은 superuser 를 쓸 수 있어 두 역할을 제대로 만든다 — 그것을 확인한다.
      - name: 런타임 역할이 NOBYPASSRLS 이고 superuser 가 아니다
        run: |
          docker exec cwdemo psql -h /var/lib/chartwire/run -p 5432 -U chartwire -d chartwire \
            -tAc "select rolbypassrls or rolsuper from pg_roles where rolname = 'chartwire_app'" > role.txt
          grep -qx f role.txt
      - name: 컨테이너 로그 (실패 시)
        if: failure()
        run: docker logs --tail 200 cwdemo
      - name: 정리
        if: always()
        run: docker rm -f cwdemo || true

  frozen-artifacts:
    # §11.3: the held-out set hash, README markers in sync with the committed JSON reports, schema dump.
    # `readme_numbers.py --check` exits 1 while any <!-- row --> in README.md is unmeasured — that is the
    # intended signal until the serial measurement window has run `--write` (§0 rule 2).
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: held-out risk set unchanged
        run: cd src/chartwire/eval/data && sha256sum -c FROZEN.txt
      - name: README numbers in sync with docs/{eval,loadtest,perf}/*.json (stdlib only)
        run: python scripts/readme_numbers.py --check
      - name: docs/loadtest/results.md is the rendered form of the JSON reports
        run: |
          pip install -e . -q
          mkdir -p "$RUNNER_TEMP/lt" && cp docs/loadtest/*.json "$RUNNER_TEMP/lt/" 2>/dev/null || true
          chartwire loadtest results --out "$RUNNER_TEMP/lt" >/dev/null
          diff -u docs/loadtest/results.md "$RUNNER_TEMP/lt/results.md" || { echo "stale: run \`chartwire loadtest results\`"; exit 1; }
