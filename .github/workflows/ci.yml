# CI 골격 (spec §12.3). lint → unit → integration → migrations 는 WP-A 가 정의했고,
# eval-smoke / load-smoke / cdk / docker / frozen-artifacts 는 WP-H 가 아래 표시된 자리에 추가한다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - name: mypy --strict (pyproject overrides list the strict modules)
        run: mypy src/chartwire/ws/core.py src/chartwire/ws/codec.py src/chartwire/notes/verifier.py src/chartwire/crypto src/chartwire/outbox
      - name: pip-audit
        run: pip-audit --progress-spinner off

  unit:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q -p no:cacheprovider --junitxml=junit-unit-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit-${{ matrix.python-version }}
          path: junit-unit-*.xml

  integration:
    needs: lint
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CHARTWIRE_SUPERUSER_URL: postgresql://postgres@localhost:5432/postgres
      CHARTWIRE_DATABASE_URL: postgresql+asyncpg://chartwire_app:chartwire_app@localhost:5432/chartwire
      CHARTWIRE_DATABASE_OWNER_URL: postgresql+psycopg://chartwire_owner:chartwire_owner@localhost:5432/chartwire
      CHARTWIRE_REDIS_URL: redis://localhost:6379/0
      CHARTWIRE_TEST_DB: chartwire_test
      CHARTWIRE_TEST_REDIS_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: bootstrap roles + databases (idempotent, superuser)
        run: chartwire db bootstrap-roles
      - name: integration / ws / rls (serial — RLS suites share one database)
        run: pytest tests/integration tests/ws tests/rls -q -p no:cacheprovider -p no:xdist --junitxml=junit-integration.xml
      # WP-H: tests/chaos 는 SIGKILL 테스트가 준비되면 위 명령에 추가한다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml

  migrations:
    needs: lint
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CHARTWIRE_SUPERUSER_URL: postgresql://postgres@localhost:5432/postgres
      CHARTWIRE_DATABASE_OWNER_URL: postgresql+psycopg://chartwire_owner:chartwire_owner@localhost:5432/chartwire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: pg_dump 16 client (server is postgres:16; the dump must come from a matching client)
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
      - run: pip install -e ".[dev]"
      - run: chartwire db bootstrap-roles
      - name: upgrade head → downgrade base → upgrade head
        run: |
          chartwire db upgrade head
          chartwire db downgrade base
          chartwire db upgrade head
      - name: schema diff against committed docs/db/schema.sql
        run: chartwire db schema-dump --check

  # ---------------------------------------------------------------------------------
  # WP-H adds the remaining jobs here (spec §12.3). Names and order are fixed so badges and
  # `needs:` chains stay stable:
  #
  #   eval-smoke:        needs: [unit]        — `chartwire eval all --seed 42 --out /tmp/eval --smoke`, upload JSON
  #   load-smoke:        needs: [integration] — `chartwire loadtest A --sessions 5 --duration 10`, upload JSON
  #   cdk:               needs: [lint]        — Node 22, `npx aws-cdk@<pinned> synth`, cdk-nag, `git diff --exit-code infra/cdk/cdk.out`
  #   docker:            needs: [lint]        — `docker build .`, `docker compose config -q`
  #   frozen-artifacts:  needs: [lint]        — sha256 of eval/data/* against eval/data/FROZEN.txt (§11.3)
  # ---------------------------------------------------------------------------------
