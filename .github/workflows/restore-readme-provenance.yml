name: Restore README provenance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-readme-provenance.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore measured sections and keep product-first intro
        run: |
          git show 49de5aa9d9fe4921b1100a525f69f89b16786d24:README.md > README.md
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('# chartwire\n\n', '# chartwire\n\n**실시간 상담 기록 → 근거 연결 초안 → 사람 검토 → 데이터 파기 증적까지 한 흐름으로 연결합니다.**\n\n', 1)
          old = '''## 추천 시연 경로 (약 60초)\n\n공개 데모: <https://chartwire.onrender.com>\n\n`새 상담 → 실시간 기록 → 초안·근거 → 사람 검토 → 파기 → 파기 영수증`\n\n1. **00–10초 · 새 상담** — 합성 대본을 선택하고 세션을 시작합니다.\n2. **10–25초 · 실시간 기록** — WebSocket 전사와 위험 신호/SLA를 확인합니다.\n3. **25–35초 · 초안·근거** — 초안 문장을 눌러 원문 evidence를 펼칩니다.\n4. **35–45초 · 사람 검토** — 문장 결정을 남기고 Assessment를 작성한 뒤 서명합니다.\n5. **45–55초 · 파기** — 동의 철회 또는 admin 파기 작업의 진행 상태를 확인합니다.\n6. **55–60초 · 파기 영수증** — 삭제·키 폐기 증적과 복호화 실패 검증을 확인합니다.\n\n> 제품 흐름을 먼저 보여주고, `seq/ack/credit/resume`, RLS, outbox/DLQ, chaos 결과는 질문이 들어오면 **시스템 상세**와 아래 기술 문서에서 보여주는 구성을 권장합니다.\n'''
          new = '''## 서비스 데모\n\n![ChartWire 서비스 데모](docs/images/demo.gif)\n\n## 빠른 확인 경로\n\n공개 데모: <https://chartwire.onrender.com>\n\n`새 상담 → 실시간 기록 → 초안·근거 → 사람 검토 → 파기 → 파기 영수증`\n\n1. **새 상담** — 합성 대본을 선택하고 세션을 시작합니다.\n2. **실시간 기록** — WebSocket 전사와 위험 신호/SLA를 확인합니다.\n3. **초안·근거** — 초안 문장을 눌러 원문 evidence를 펼칩니다.\n4. **사람 검토** — 문장 결정을 남기고 Assessment를 작성한 뒤 서명합니다.\n5. **파기** — 동의 철회 또는 admin 파기 작업의 진행 상태를 확인합니다.\n6. **파기 영수증** — 삭제·키 폐기 증적과 복호화 실패 검증을 확인합니다.\n\n> 제품 흐름을 먼저 확인한 뒤, `seq/ack/credit/resume`, RLS, outbox/DLQ, chaos 결과는 **시스템 상세**와 아래 기술 문서에서 확인할 수 있습니다.\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify frozen-number provenance
        run: |
          python scripts/readme_numbers.py --check
          python scripts/readme_numbers.py --check --readme docs/perf/README.md
          python scripts/readme_numbers.py --check --readme console/index.html

      - name: Commit restored README
        run: |
          rm .github/workflows/restore-readme-provenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve measured README provenance"
          git push origin main
