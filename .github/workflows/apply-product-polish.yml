name: Apply product polish
on:
  push:
    paths:
      - '.github/workflows/apply-product-polish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged replacements
        run: python tools/apply_replacements.py
      - name: Validate staged UI copy
        run: |
          grep -q '상담 업무 흐름' console/index.html
          grep -q '네트워크가 끊겨도 기록은 이어집니다' console/index.html
          grep -q '먼저 볼 장면 3개' README.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add console/index.html README.md
          git commit -m "polish: make product value obvious at first glance"
          git push
