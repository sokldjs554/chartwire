          function renderDetailedReceipt(job){const st=job.state||job.status||'?';const ok=st==='verified'||st==='completed'||st==='done';const counts=job.counts||{};const countRows=Object.entries(counts).sort().map(([k,v])=>`<tr><td>${esc(COUNT_KO[k]||k)}</td><td class="mono">${esc(v)}</td></tr>`).join('')||'<tr><td>삭제 집계 없음</td><td>–</td></tr>';const steps=(job.steps||[]).map((s,i)=>`<tr><td>${i+1}. ${esc(STEP_KO[s.step||s.name]||s.step||s.name||'step')}</td><td class="mono">${esc(s.count??'–')}</td><td>${esc(fmtClock(s.at||s.ts))}</td></tr>`).join('')||'<tr><td colspan="3">아직 처리 단계가 없습니다.</td></tr>';const rawChecks=job.checks||job.verification||{};const entries=Array.isArray(rawChecks)?rawChecks.map((x,i)=>[x.name||x.check||`check-${i+1}`,x.ok??x.passed??x.value]):Object.entries(rawChecks);const checks=entries.map(([k,v])=>{const pass=v===true||v==='ok'||v==='passed'||v===0;return`<div class="receipt-check ${pass?'ok':'bad'}"><b>${pass?'✓':'!'}</b> ${esc(CHECK_KO[k]||k)}<div class="mono">${esc(typeof v==='object'?JSON.stringify(v):v)}</div></div>`}).join('')||'<div class="receipt-check">검증 결과가 아직 없습니다.</div>';const valid=job.receipt_hash_valid;const hashLabel=valid===true?'재계산 해시 일치':valid===false?'해시 불일치':'해시 검증 필드 없음';const fp=(job.dek_fingerprints||[]).map(x=>String(x).slice(0,20)+'…').join(', ')||'–';$('receiptBox').className='receipt paper';$('receiptBox').innerHTML=`<div class="receipt-head"><strong>파기 영수증</strong><span class="status ${ok?'ready':st==='failed'?'review':'closed'}">${esc(st)}</span><span class="rid mono">${esc(job.id||state.purgeJobId||'')}</span></div><div class="receipt-section"><table class="receipt-meta"><tr><td>대상</td><td>${esc(job.subject_type||'–')} · ${esc(String(job.subject_id||'–'))}</td></tr><tr><td>사유</td><td>${esc(job.reason||'–')}</td></tr><tr><td>시각</td><td>요청 ${esc(fmtClock(job.requested_at))}<br>완료 ${esc(fmtClock(job.completed_at))}<br>검증 ${esc(fmtClock(job.verified_at))}</td></tr></table></div><div class="receipt-section"><h4>삭제 집계</h4><table class="receipt-table">${countRows}</table></div><div class="receipt-section"><h4>단계별 처리</h4><table class="receipt-table"><thead><tr><th>단계</th><th>count</th><th>시각</th></tr></thead><tbody>${steps}</tbody></table></div><div class="receipt-section"><h4>검증 — 남은 것이 없고 열리지 않는지</h4><div class="receipt-checks">${checks}</div></div><div class="receipt-section"><h4>무결성</h4><div style="font-size:11px;margin-bottom:7px"><b>${esc(hashLabel)}</b> · DEK fingerprint ${esc(fp)}</div><div class="receipt-hash">${esc(job.receipt_hash||'–')}</div><details><summary>원본 JSON 보기</summary><pre>${esc(JSON.stringify(job,null,2))}</pre></details></div>`}
          async function loadConsent(){if(!state.patientId){$('consentText').textContent='상담 기록에서 세션을 선택하거나 새 합성 상담을 시작하세요.';$('consentHistory').textContent='';return}try{const list=await api('GET',`/v1/patients/${state.patientId}/consents`);const arr=Array.isArray(list)?list:[];const latest=arr[arr.length-1];$('consentText').textContent=latest?`동의 v${latest.version} · ${(latest.scopes||[]).join(', ')}${latest.revoked_at?' · 철회됨':''}`:'동의 기록 없음';$('consentHistory').innerHTML=arr.slice(-5).reverse().map(c=>`v${esc(c.version)} · ${(c.scopes||[]).map(esc).join(', ')}${c.revoked_at?` · 철회 ${esc(fmtClock(c.revoked_at))}`:' · 활성'}`).join('<br>');$('lifeTitle').textContent=`${String(state.sessionId||'').slice(0,8)} 수명주기`}catch(e){toast(`동의 조회 실패 · ${e.message}`,true)}}
          function startPurgeTracking(id){if(!id)return;state.purgeJobId=id;state.purgeSeen=0;$('purgeJobInput').value=id;clearInterval(state.purgeTimer);resetPurgeSteps();purgeStep('purgeStepRevoke','done');purgeStep('purgeStepOutbox','done');purgeStep('purgeStepPurge','doing');$('purgeLog').innerHTML='';appendPurgeLog(`purge job ${id} 추적 시작`);trackReceipt(true)}
          async function revokeConsent(){if(!state.patientId)return toast('먼저 세션을 선택해 주세요.',true);try{const list=await api('GET',`/v1/patients/${state.patientId}/consents`);const latest=[...(Array.isArray(list)?list:[])].reverse().find(c=>!c.revoked_at);if(!latest)return toast('활성 동의가 없습니다.',true);resetPurgeSteps();purgeStep('purgeStepRevoke','doing');const out=await api('POST',`/v1/consents/${latest.id}/revoke`,{reason:'환자 요청(데모)'},{idempotent:true});state.purgeJobId=out?.purge_job_id||out?.purge_job?.id||null;purgeStep('purgeStepRevoke','done');purgeStep('purgeStepOutbox','doing');$('purgeStatus').textContent='파기 예약';$('purgeStatus').className='status review';appendPurgeLog(`consent ${latest.id} revoked → outbox consent.revoked`);toast('동의 철회 · 파기 예약');if(state.purgeJobId)startPurgeTracking(state.purgeJobId);else appendPurgeLog('purge job id는 worker가 생성합니다. admin으로 직접 생성하거나 ID를 추적하세요.')}catch(e){purgeStep('purgeStepRevoke','bad');toast(`철회 실패 · ${e.message}`,true)}}
          async function createPurgeJob(){if(!state.sessionId)return toast('먼저 세션을 선택해 주세요.',true);if(state.role!=='admin'){state.token=null;if(!await login('admin'))return}try{const out=await api('POST','/v1/purge-jobs',{subject_type:'session',subject_id:state.sessionId},{idempotent:true});const id=out?.id||out?.purge_job_id;if(!id)throw new Error('purge job id 없음');startPurgeTracking(id);toast('파기 작업을 생성했습니다.')}catch(e){toast(`파기 작업 생성 실패 · ${e.message}`,true)}}
          async function trackReceipt(poll=false){const manual=$('purgeJobInput')?.value.trim();if(manual)state.purgeJobId=manual;if(!state.purgeJobId)return toast('먼저 파기 작업이 생성되어야 합니다.',true);if(state.role!=='admin'&&state.role!=='auditor'){state.token=null;if(!await login('admin'))return}try{const job=await api('GET',`/v1/purge-jobs/${state.purgeJobId}`);const status=job.state||job.status||'processing';$('purgeStatus').textContent=status;$('purgeStatus').className=`status ${status==='verified'?'ready':'review'}`;$('purgeJobInput').value=job.id||state.purgeJobId;const steps=job.steps||[];for(;state.purgeSeen<steps.length;state.purgeSeen++){const s=steps[state.purgeSeen];appendPurgeLog(`step ${s.step||s.name||state.purgeSeen+1}: ${s.count!=null?`count=${s.count} `:''}${s.at||s.ts||''}`.trim())}renderDetailedReceipt(job);purgeStep('purgeStepRevoke','done');purgeStep('purgeStepOutbox','done');if(status==='failed'){purgeStep('purgeStepPurge','bad');purgeStep('purgeStepVerify','bad')}else if(FINAL_PURGE.has(status)){purgeStep('purgeStepPurge','done');purgeStep('purgeStepVerify',status==='verified'?'done':'doing')}else purgeStep('purgeStepPurge','doing');purgeStep('purgeStepReceipt',job.receipt_hash?'done':'doing');$('verifyDecrypt').disabled=status!=='verified';if(FINAL_PURGE.has(status)){clearInterval(state.purgeTimer);state.purgeTimer=null;appendPurgeLog(`영수증 state=${status} · hash=${job.receipt_hash||'–'}`)}else if(poll&&!state.purgeTimer){state.purgeTimer=setInterval(()=>trackReceipt(false),1000)}}catch(e){appendPurgeLog(`조회 실패 · ${e.message}`);toast(`영수증 조회 실패 · ${e.message}`,true)}}
