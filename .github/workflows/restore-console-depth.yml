name: Restore ChartWire deep demo features

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-console-depth.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply restoration patch
        run: python .github/restore_console_depth.py

      - name: Verify browser script and focused tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("console/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", text, re.S)
          assert len(scripts) == 1
          Path("/tmp/chartwire-console.js").write_text(scripts[0], encoding="utf-8")
          ids = re.findall(r'id="([^"]+)"', text)
          assert len(ids) == len(set(ids))
          for marker in (
              'data-depth-restored="v5"',
              'renderDetailedReceipt',
              'purgeJobInput',
              'purgeLog',
              'scriptSelect',
              'riskSla',
              'opsAuto',
              'value="staff"',
              'receipt_hash_valid',
          ):
              assert marker in text, marker
          PY
          node --check /tmp/chartwire-console.js
          pip install -e ".[dev]"
          pytest -q tests/unit/test_console_redesign_contract.py tests/unit/test_console_protocol_redesign.py

      - name: Commit restored console
        run: |
          rm .github/restore_console_depth.py
          rm .github/workflows/restore-console-depth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add console/index.html .github/restore_console_depth.py .github/workflows/restore-console-depth.yml
          git commit -m "Restore ChartWire detailed demo features"
          git push origin HEAD:main
