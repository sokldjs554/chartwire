name: story-ui-upgrade

on:
  push:
    paths:
      - 'scripts/upgrade_console_story_ui.py'
      - '.github/workflows/story-ui-upgrade.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply story UI upgrade
        run: python scripts/upgrade_console_story_ui.py
      - name: Check embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('console/index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', s, re.S)
          assert m
          Path('/tmp/chartwire-console.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/chartwire-console.js
      - name: Commit upgraded console
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add console/index.html
          if git diff --cached --quiet; then
            echo 'No console changes.'
            exit 0
          fi
          git commit -m 'style: add 60-second guided demo and visual hierarchy'
          git push
