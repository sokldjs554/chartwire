name: relocate-demo-guide

on:
  push:
    paths:
      - scripts/relocate_demo_guide.py

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move evaluator guidance out of live console
        run: python scripts/relocate_demo_guide.py
      - name: Validate console JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('console/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert len(scripts)==1
          Path('/tmp/chartwire-console.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/chartwire-console.js
      - name: Commit relocated guide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add console/index.html README.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix: keep demo guidance in README only'
            git push
          fi
