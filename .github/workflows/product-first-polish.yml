name: Product-first polish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/product-first-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch product presentation
        run: python scripts/product_first_polish.py
      - name: Validate
        run: python -m pytest tests/unit/test_console_redesign_contract.py -q
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add console/index.html README.md tests/unit/test_console_redesign_contract.py
          git commit -m "polish: make ChartWire product flow easier to grasp"
          git push
