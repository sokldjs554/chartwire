name: Product-first landing polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-first-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply product-first polish
        run: python .github/scripts/product_polish.py

      - name: Validate console syntax and markers
        run: |
          python -c 'import pathlib,re; h=pathlib.Path("console/index.html").read_text(encoding="utf-8"); s=re.findall(r"<script>(.*?)</script>",h,flags=re.S); assert len(s)==1; pathlib.Path("/tmp/console.js").write_text(s[0],encoding="utf-8"); assert "consult-preview-v1" in h; assert "새 합성 상담 시작" not in h'
          node --check /tmp/console.js

      - name: Commit polished product surface
        run: |
          rm .github/workflows/product-first-polish.yml .github/scripts/product_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sharpen product-first ChartWire landing"
          git push origin main
