name: Product-first landing polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-first-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply product-first polish
        run: |
          echo '' | base64 -d > /tmp/product_polish.py
          python /tmp/product_polish.py

      - name: Run focused contract tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/unit/test_console_redesign_contract.py

      - name: Commit polished product surface
        run: |
          rm .github/workflows/product-first-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: sharpen product-first ChartWire landing"
          git push origin main
