name: Product-first polish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/product-first-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -q -e ".[dev]"
      - name: Patch product presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('console/index.html')
          s=p.read_text()
          if 'product-path-v1' not in s:
              s=s.replace('/* consult-preview-v1 */','''/* product-path-v1 */
          .product-path{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 0}
          .product-step{position:relative;display:flex;gap:11px;align-items:flex-start;padding:14px 15px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 20px rgba(31,65,55,.035)}
          .product-step:not(:last-child):after{content:"→";position:absolute;right:-9px;top:26px;z-index:2;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:#8ca098;font-size:11px}
          .product-step .step-no{flex:0 0 27px;width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:900}
          .product-step b{display:block;font-size:12px;margin:1px 0 4px}.product-step small{display:block;color:var(--muted);font-size:10px;line-height:1.45}
          @media(max-width:900px){.product-path{grid-template-columns:1fr 1fr}.product-step:nth-child(2):after{display:none}}
          @media(max-width:620px){.product-path{grid-template-columns:1fr}.product-step:after{display:none}}

          /* consult-preview-v1 */''',1)
          anchor='''        <div class="section-head"><div><h2>핵심 기능</h2><p>상담 흐름에 필요한 핵심 동작만 먼저 보여줍니다.</p></div></div>'''
          if '상담 업무 흐름' not in s:
              block='''        <div class="section-head" style="margin-top:22px"><div><h2>상담 업무 흐름</h2><p>기록부터 검토와 데이터 수명주기까지 한 제품 안에서 이어집니다.</p></div></div>
        <div class="product-path product-path-v1" aria-label="상담 업무 흐름">
          <div class="product-step"><span class="step-no">01</span><div><b>상담 시작</b><small>합성 대본으로 안전하게 세션을 시작합니다.</small></div></div>
          <div class="product-step"><span class="step-no">02</span><div><b>기록 · 근거</b><small>실시간 기록과 초안 문장을 원문 발화에 연결합니다.</small></div></div>
          <div class="product-step"><span class="step-no">03</span><div><b>사람 검토</b><small>의료진이 수정·판단한 뒤 서명합니다.</small></div></div>
          <div class="product-step"><span class="step-no">04</span><div><b>보존 · 파기</b><small>보존 경계와 파기 증적을 데이터 수명주기로 관리합니다.</small></div></div>
        </div>

'''+anchor
              assert anchor in s
              s=s.replace(anchor,block,1)
          pairs=[
          ('<h3>Realtime delivery</h3><p><b>seq / ack / credit / resume / epoch</b>로 WebSocket 재연결과 재전송을 다룹니다. ACK는 PostgreSQL durable commit 이후에만 증가합니다.</p><div class="metric-row"><div class="metric"><b>500 chunk/s</b>N=100</div>', '<h3>네트워크가 끊겨도 기록은 이어집니다</h3><p>사용자에게는 끊김 없는 상담 기록으로 보입니다. 내부에서는 <b>seq / ack / credit / resume / epoch</b>로 재연결·재전송을 처리하고, ACK는 PostgreSQL durable commit 이후에만 증가합니다.</p><div class="metric-row"><div class="metric"><b>500 chunk/s</b>same-host N=100</div>'),
          ('<h3>Tenant isolation</h3><p>PostgreSQL RLS와 단일 app role을 사용해 테넌트 경계를 DB 수준에서도 강제합니다. 라우트 × 역할 × 테넌트 매트릭스 테스트를 둡니다.</p>', '<h3>기관이 달라지면 데이터도 분리됩니다</h3><p>애플리케이션 필터에만 기대지 않고 PostgreSQL RLS와 단일 app role로 테넌트 경계를 DB 수준에서 강제합니다. 라우트 × 역할 × 테넌트 매트릭스로 회귀를 검증합니다.</p>'),
          ('<h3>Outbox & recovery</h3><p>Transactional outbox → Redis Streams → worker 흐름으로 비동기 이벤트 전달과 재시도를 다룹니다.</p><div class="metric-row"><div class="metric"><b>413 ev/s</b>100K outbox</div><div class="metric"><b>0</b>DLQ</div>', '<h3>비동기 작업이 실패해도 추적할 수 있습니다</h3><p>Transactional outbox → Redis Streams → worker 흐름으로 전달·재시도·DLQ를 분리해 처리 중단이 조용히 사라지지 않게 합니다.</p><div class="metric-row"><div class="metric"><b>413 ev/s</b>same-host 100K outbox</div><div class="metric"><b>0</b>DLQ in measured run</div>'),
          ('<h3>Consent & purge</h3><p>세션 데이터는 crypto-shred 대상으로, 보존이 필요한 서명 기록은 별도 retention 경계로 관리합니다.</p>', '<h3>삭제 요청 뒤에는 복호화까지 막습니다</h3><p>세션 데이터는 crypto-shred 대상으로 처리하고, 보존이 필요한 서명 기록은 별도 retention 경계로 분리합니다. 파기 후에는 검증 결과와 영수증을 증적으로 남깁니다.</p>')]
          for a,b in pairs:
              if a in s: s=s.replace(a,b,1)
          p.write_text(s)

          p=Path('README.md'); r=p.read_text()
          old='''## 서비스 데모\n\n![ChartWire 서비스 데모](docs/images/demo.gif)\n\n## 제품 흐름'''
          new='''## 서비스 데모\n\n![ChartWire 서비스 데모](docs/images/demo.gif)\n\n**먼저 볼 장면 3개** — `상담 시작·실시간 기록` → `초안 문장의 원문 근거` → `검토·파기 영수증`.  
처음에는 제품 흐름만 보고, 프로토콜·RLS·outbox·부하 수치는 필요할 때 아래 기술 섹션에서 확인하면 됩니다.\n\n## 제품 흐름'''
          if '**먼저 볼 장면 3개**' not in r:
              assert old in r; r=r.replace(old,new,1)
          p.write_text(r)
          PY
      - name: Validate
        run: |
          python -m pytest tests/unit/test_console_redesign_contract.py tests/unit/test_product_first_landing_contract.py -q
          python - <<'PY'
          import re
          from pathlib import Path
          h=Path('console/index.html').read_text()
          for needle in ('product-path-v1','상담 업무 흐름','네트워크가 끊겨도 기록은 이어집니다','기관이 달라지면 데이터도 분리됩니다','비동기 작업이 실패해도 추적할 수 있습니다','삭제 요청 뒤에는 복호화까지 막습니다'):
              assert needle in h, needle
          scripts=re.findall(r'<script>(.*?)</script>',h,flags=re.S)
          assert len(scripts)==1
          Path('/tmp/console.js').write_text(scripts[0])
          PY
          node --check /tmp/console.js
      - name: Remove one-shot workflow
        run: rm .github/workflows/product-first-polish.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add console/index.html README.md .github/workflows/product-first-polish.yml
          git commit -m "polish: make ChartWire product flow easier to grasp"
          git push
